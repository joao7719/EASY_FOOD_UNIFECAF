<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyFood - Restaurantes</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
      }
      .container {
        max-width: 1000px;
        margin: 40px auto;
        padding: 24px;
      }
      .nav {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .nav a {
        background: #1f2937;
        color: #fff;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 10px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }
      h1, h2 { margin-top: 0; }
      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      input, button {
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #d1d5db;
        font-size: 1rem;
      }
      button {
        background: #16a34a;
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      .message {
        margin-top: 12px;
        min-height: 24px;
        font-weight: 600;
      }
      .success { color: #166534; }
      .error { color: #b91c1c; }
      .list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 12px;
      }
      .restaurant-item {
        padding: 12px 14px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #f9fafb;
      }
      .restaurant-item strong { display: block; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="nav">
        <a href="/">Home</a>
        <a href="/usuarios.html">Usuários</a>
        <a href="/restaurantes.html">Restaurantes</a>
      </div>

      <div class="grid">
        <section class="card">
          <h2>Cadastrar restaurante</h2>
          <form id="restaurant-form">
            <input type="text" id="name" placeholder="Nome do restaurante" required />
            <input type="text" id="category" placeholder="Categoria" required />
            <input type="number" id="rating" min="0" max="5" step="0.5" value="4.5" required />
            <button type="submit">Cadastrar restaurante</button>
          </form>
          <div id="restaurant-message" class="message"></div>
        </section>

        <section class="card">
          <h2>Restaurantes cadastrados</h2>
          <button id="load-button" type="button">Ver restaurantes</button>
          <div id="restaurant-list" class="list"></div>
        </section>
      </div>
    </div>

    <script>
      const API_URL = 'http://localhost:3000';
      const restaurantForm = document.getElementById('restaurant-form');
      const restaurantMessage = document.getElementById('restaurant-message');
      const restaurantList = document.getElementById('restaurant-list');
      const loadButton = document.getElementById('load-button');

      function setMessage(element, type, text) {
        element.className = `message ${type}`;
        element.textContent = text;
      }

      async function loadRestaurants() {
        try {
          const response = await fetch(`${API_URL}/restaurants`);
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Erro ao carregar restaurantes');
          }

          if (!data.length) {
            restaurantList.innerHTML = '<p>Nenhum restaurante cadastrado.</p>';
            return;
          }

          restaurantList.innerHTML = data.map((restaurant) => `
            <div class="restaurant-item">
              <strong>${restaurant.name}</strong>
              <span>Categoria: ${restaurant.category}</span><br />
              <span>Avaliação: ${restaurant.rating}</span>
            </div>
          `).join('');
        } catch (error) {
          restaurantList.innerHTML = `<p>${error.message}</p>`;
        }
      }

      restaurantForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const payload = {
          name: document.getElementById('name').value,
          category: document.getElementById('category').value,
          rating: Number(document.getElementById('rating').value)
        };

        try {
          const response = await fetch(`${API_URL}/restaurants`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Erro ao cadastrar restaurante');
          }

          setMessage(restaurantMessage, 'success', 'Restaurante cadastrado com sucesso.');
          restaurantForm.reset();
          document.getElementById('rating').value = '4.5';
          await loadRestaurants();
        } catch (error) {
          setMessage(restaurantMessage, 'error', error.message);
        }
      });

      loadButton.addEventListener('click', loadRestaurants);
      loadRestaurants();
    </script>
  </body>
</html>
